name: 異界旅人 PWA Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate App source
        run: npm run test:game
      - name: Clean rebuild web game
        run: npm run prepare:web
      - name: Validate PWA bundle
        run: npm run test:bundle
