name: Deploy 異界旅人 New Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yijie-luren-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 異界旅人 App source
        run: npm run test:game
      - name: Delete old web build and create new web game
        run: npm run prepare:web
      - name: Validate new web bundle
        run: npm run test:bundle
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload new web game
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'
      - name: Deploy new web game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public version
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pages.cjs
